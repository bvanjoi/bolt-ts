[package]
name = "bolt_ts_fs"
version = "0.1.0"
edition = "2024"

[dependencies]
bolt_ts_atom = { path = "../atom" }
bolt_ts_utils = { path = "../utils" }
nohash-hasher = { workspace = true }
rustc-hash = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
